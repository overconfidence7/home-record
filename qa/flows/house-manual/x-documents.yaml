# Not a walkthrough step (x- prefix): Documents from the More tab (AC-C37): one create action, a FAB menu with Add a file and Scan a document (rule 13); the viewer opens from a row (needs a seeded document, JVM tests cover it). The system file picker is not driven here; JVM tests cover the add path.
appId: com.kurtz.homerecord.housemanual
---
- runFlow: _onboard.yaml
- tapOn: "More"
- tapOn:
    id: "hm_more_documents"
- assertVisible: "No documents yet"
- assertVisible:
    id: "hm_documents_add"
- assertVisible:
    id: "hm_documents_fab"
- assertNotVisible:
    id: "hm_documents_scan"
- takeScreenshot: x-documents
- tapOn:
    id: "hm_documents_add"
- assertVisible:
    id: "hm_documents_upload"
- assertVisible:
    id: "hm_documents_scan"
- takeScreenshot: x-documents-add-menu
- tapOn:
    id: "hm_documents_fab"
- assertNotVisible:
    id: "hm_documents_scan"

