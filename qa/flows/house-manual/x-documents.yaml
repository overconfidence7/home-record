# Not a walkthrough step (x- prefix): Documents from the More tab (AC-C37): upload and camera scan buttons; the viewer opens from a row (needs a seeded document, JVM tests cover it). The system file picker is not driven here; JVM tests cover the add path.
appId: com.kurtz.homerecord.housemanual
---
- runFlow: _onboard.yaml
- tapOn: "More"
- tapOn:
    id: "hm_more_documents"
- assertVisible: "No documents yet"
- assertVisible:
    id: "hm_documents_add"
- assertVisible:
    id: "hm_documents_fab"
- assertVisible:
    id: "hm_documents_scan"
- takeScreenshot: x-documents
