# Walkthrough H4: add a furnace from the Items tab (AC-C30). Needs a home, so it starts from the onboarding helper.
appId: com.kurtz.homerecord.housemanual
---
- runFlow: _onboard.yaml
- tapOn: "Items"
- assertVisible: "No items yet"
- tapOn:
    id: "hm_items_add"
- assertVisible: "Add item"
# Save with nothing filled shows what is missing instead of closing
- tapOn:
    id: "hm_save"
- assertVisible: "Choose what kind of item this is."
- tapOn:
    id: "hm_item_type"
- tapOn:
    id: "hm_item_type_furnace"
- tapOn:
    id: "hm_item_room"
- tapOn: "Whole house"
- tapOn:
    id: "hm_item_make"
- inputText: "Carrier"
- hideKeyboard
- takeScreenshot: H04-item-form
# AC-C30: photo buttons (data plate, item) sit at the end of the form
- scrollUntilVisible:
    element:
      id: "hm_item_photo_data_plate"
- assertVisible:
    id: "hm_item_photo_item"
# AC-C31: the data plate button offers camera and gallery (the on-device scan sheet follows the photo; OCR itself is covered by DataPlateParserTest and ItemEditViewModelTest)
- tapOn:
    id: "hm_item_photo_data_plate"
- assertVisible: "Take photo"
- assertVisible: "Choose from gallery"
- pressKey: back
- tapOn:
    id: "hm_save"
# AC-C35: default consumables and reminders for the subtype are seeded on save (asserted in ItemRepositoryTest; Reminders tab arrives with T031)
# The form closes back to the Items tab
- assertNotVisible:
    id: "hm_save"
- assertVisible:
    id: "hm_items_fab"
