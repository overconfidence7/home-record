# Walkthrough H4: add a furnace from the Items tab (AC-C30). Needs a home, so it starts from the onboarding helper.
appId: com.kurtz.homerecord.housemanual
---
- runFlow: _onboard.yaml
- tapOn: "Items"
- assertVisible: "No items yet"
- tapOn:
    id: "hm_items_add"
- assertVisible: "Add item"
# Save with nothing filled shows what is missing instead of closing
- tapOn:
    id: "hm_save"
- assertVisible: "Choose what kind of item this is."
- tapOn:
    id: "hm_item_type"
- tapOn:
    id: "hm_item_type_furnace"
- tapOn:
    id: "hm_item_room"
- tapOn: "Whole house"
- tapOn:
    id: "hm_item_make"
- inputText: "Carrier"
- hideKeyboard
- takeScreenshot: H04-item-form
# AC-C30: photo buttons (data plate, item) sit at the end of the form
- scrollUntilVisible:
    element:
      id: "hm_item_photo_data_plate"
- assertVisible:
    id: "hm_item_photo_item"
# AC-C31: the data plate button offers camera and gallery (the on-device scan sheet follows the photo; OCR itself is covered by DataPlateParserTest and ItemEditViewModelTest)
- tapOn:
    id: "hm_item_photo_data_plate"
- assertVisible: "Take photo"
- assertVisible: "Choose from gallery"
- pressKey: back
- tapOn:
    id: "hm_save"
# AC-C35: default consumables and reminders for the subtype are seeded on save (asserted in ItemRepositoryTest; Reminders tab arrives with T031)
# The form closes back to the Items tab
- assertNotVisible:
    id: "hm_save"
- assertVisible:
    id: "hm_items_fab"
# AC-H6: the saved item shows in the grouped list; switching to by-room and filtering by warranty status work
- assertVisible: "Furnace.*"
- tapOn:
    id: "hm_items_group_room"
- assertVisible: "Whole house.*"
- tapOn:
    id: "hm_items_filter_warranty_expired"
- assertVisible: "No items match"
- tapOn:
    id: "hm_items_clear"
- assertVisible: "Whole house.*"
- tapOn:
    id: "hm_items_group_category"
- assertVisible: "Heating and cooling.*"
# AC-H7: a row opens the item page with details, warranty section and the overflow menu
- tapOn: "Furnace.*"
- assertVisible:
    id: "hm_item_detail_status"
- assertVisible:
    id: "hm_item_detail_edit"
- tapOn:
    id: "hm_item_detail_more"
- assertVisible: "Duplicate"
- assertVisible: "Delete"
- pressKey: back
# AC-C34: a warranty section without terms offers the lookup (the seed furnace has a make and model)
- scrollUntilVisible:
    element:
      id: "hm_item_detail_lookup"
- assertVisible:
    id: "hm_item_detail_lookup"
