# Walkthrough H19: Pro paywall from the More tab (AC-H18). Plans need the Test Store key; without it the Retry state shows.
appId: com.kurtz.homerecord.housemanual
---
- runFlow: _onboard.yaml
- tapOn: "More"
# AC-H18 (paywall part): Pro opens HM-Paywall with the reason and Restore; prices need the Test Store key
- tapOn:
    id: "hm_more_pro"
- assertVisible: "Restore purchases"
- assertVisible:
    id: "hm_paywall_reason"
- takeScreenshot: H19-paywall
