# Walkthrough H19: Pro paywall from the More tab and from the second panel (AC-H18). Plans need the Test Store key;
# without it the Retry state shows. QA builds have no key, so the free tier's limits hold.
appId: com.kurtz.homerecord.housemanual
---
- runFlow: _onboard.yaml
- tapOn: "More"
# AC-H18 (paywall part): Pro opens HM-Paywall with the reason and Restore; prices need the Test Store key
- scrollUntilVisible:
    element:
      id: "hm_more_pro"
- tapOn:
    id: "hm_more_pro"
- assertVisible: "Restore purchases"
- assertVisible:
    id: "hm_paywall_reason"
- takeScreenshot: H19-paywall
# AC-H18 (second panel): the free tier files one breaker panel; saving a second one opens the paywall instead.
# The paywall is full screen with no tab bar: Back returns to More
- back
- extendedWaitUntil:
    visible:
      id: "hm_tab_items"
    timeout: 5000
- tapOn:
    id: "hm_tab_items"
- tapOn:
    id: "hm_items_add"
- tapOn:
    id: "hm_item_type"
- tapOn:
    id: "hm_item_type_search"
- inputText: "panel"
- extendedWaitUntil:
    visible:
      id: "hm_item_type_breaker_panel"
    timeout: 5000
- tapOn:
    id: "hm_item_type_breaker_panel"
- tapOn:
    id: "hm_item_room"
- tapOn: "Whole house"
- tapOn:
    id: "hm_save"
- extendedWaitUntil:
    visible:
      id: "hm_items_fab"
    timeout: 10000
- assertVisible: "Breaker panel.*"
- tapOn:
    id: "hm_items_fab"
- tapOn:
    id: "hm_item_type"
- tapOn:
    id: "hm_item_type_search"
- inputText: "panel"
- extendedWaitUntil:
    visible:
      id: "hm_item_type_sub_panel"
    timeout: 5000
- tapOn:
    id: "hm_item_type_sub_panel"
- tapOn:
    id: "hm_item_room"
- tapOn: "Whole house"
- tapOn:
    id: "hm_save"
- extendedWaitUntil:
    visible:
      id: "hm_paywall_reason"
      text: "The free tier holds one panel."
    timeout: 10000
- assertVisible: "Restore purchases"
- takeScreenshot: H19-second-panel
