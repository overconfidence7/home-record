# Walkthrough H3: the House tab shows a blueprint; tapping a room opens it; long press shows
# Rename / Delete (AC-C13, AC-C14). Builds on H02.
# Stage buttons are radio buttons to accessibility, so the chosen stage is asserted as `checked` (not `selected`).
appId: com.kurtz.homerecord.housemanual
---
- runFlow: H02-draw-plan.yaml
- tapOn:
    id: "hm_tab_house"
- assertVisible: "Tap a room to open it. Press and hold for more."
- tapOn: "Kitchen"
- takeScreenshot: H03-room-kitchen
# Room page is a non-root screen: it has the back arrow and names the room (AC-U2, ui rule 7)
- assertVisible:
    id: "hm_back"
- assertVisible: "Kitchen"
# AC-C4: the length H02 typed as 12'6" reads back as 12' 6"
- assertVisible: '14'' by 12'' 6".*'
# Room page sections are present as the T017 shell of AC-H10 (items list arrives with T021+)
- assertVisible:
    id: "hm_room_items"
# AC-C17: the Walls section lists the kitchen's four walls by side and length, on the Finished stage first
- scrollUntilVisible:
    element:
      id: "hm_room_wall_stage_finished"
- assertVisible:
    id: "hm_room_wall_stage_finished"
    checked: true
- tapOn:
    id: "hm_room_wall_stage_rough_in"
- assertVisible:
    id: "hm_room_wall_stage_rough_in"
    checked: true
- scrollUntilVisible:
    element: "North wall"
- assertVisible: "North wall"
- scrollUntilVisible:
    element: "West wall"
- assertVisible: '.*long · No photos yet'
- takeScreenshot: H03-room-walls
# AC-C22: "View in 3D" on the room page stands the camera inside the kitchen; Back to floor shows the whole floor
- scrollUntilVisible:
    element:
      id: "hm_room_view_3d"
    direction: UP
- tapOn:
    id: "hm_room_view_3d"
- extendedWaitUntil:
    visible: "Kitchen in 3D"
    timeout: 15000
- assertVisible:
    id: "hm_3d_scene"
- assertVisible: "Drag to look around, pinch to step closer."
- swipe:
    from:
      id: "hm_3d_scene"
    direction: LEFT
- takeScreenshot: H03-3d-room
- tapOn:
    id: "hm_3d_back_to_floor"
- extendedWaitUntil:
    visible: "Main in 3D"
    timeout: 15000
- assertNotVisible:
    id: "hm_3d_back_to_floor"
- tapOn:
    id: "hm_back"
- extendedWaitUntil:
    visible:
      id: "hm_room_view_3d"
    timeout: 5000
- tapOn:
    id: "hm_back"
- longPressOn: "Kitchen"
- assertVisible:
    id: "hm_sheet_rename"
- assertVisible:
    id: "hm_sheet_delete"
- takeScreenshot: H03-room-long-press
- back
# AC-C20: "3D view" opens the floor in 3D with Reset view, the stage selector and the floor's walls
- scrollUntilVisible:
    element:
      id: "hm_house_3d"
- tapOn:
    id: "hm_house_3d"
- extendedWaitUntil:
    visible:
      id: "hm_3d_reset"
    timeout: 15000
- assertVisible:
    id: "hm_3d_scene"
- assertVisible:
    id: "hm_3d_stage_finished"
    checked: true
- assertVisible: "Main in 3D"
- tapOn:
    id: "hm_3d_reset"
- takeScreenshot: H03-3d
# AC-C21: All floors stacks every floor, pulled apart; picking a floor again shows it over the faded floors below
- tapOn:
    id: "hm_3d_floor_all"
- extendedWaitUntil:
    visible: "All floors in 3D"
    timeout: 15000
- assertVisible:
    id: "hm_3d_scene"
- takeScreenshot: H03-3d-all-floors
- tapOn: "Main"
- extendedWaitUntil:
    visible: "Main in 3D"
    timeout: 15000
- tapOn:
    id: "hm_back"
- assertVisible:
    id: "hm_house_3d"
# Layer chips toggle overlays and stay set after a restart (AC-C15)
- tapOn:
    id: "hm_layer_electrical"
- takeScreenshot: H03-layer-electrical
- stopApp
- launchApp
- tapOn:
    id: "hm_tab_house"
- assertVisible:
    id: "hm_layer_electrical"
# Floors screen: add a floor, see it listed (AC-C3)
- tapOn:
    id: "hm_house_floors"
- assertVisible:
    id: "hm_floors_fab"
- tapOn:
    id: "hm_floors_fab"
- tapOn:
    id: "hm_floors_name"
- eraseText: 20
- inputText: "Attic"
- hideKeyboard
- tapOn:
    id: "hm_floors_save"
- assertVisible: "Attic"
- takeScreenshot: H03-floors
- tapOn:
    id: "hm_back"
# Export PDF is offered on the House tab; the share sheet itself is not driven (AC-C16)
- tapOn:
    id: "hm_tab_house"
- scrollUntilVisible:
    element:
      id: "hm_house_export"
- assertVisible:
    id: "hm_house_export"
