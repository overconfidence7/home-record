# Helper, not a walkthrough step: fill the onboarding form (name, style, foundation) and Skip, so
# a flow that is not about onboarding reaches the five tabs. Starts from a cleared app so a previous
# flow's home does not skip the form. Skip needs a name and a style.
appId: com.kurtz.homerecord.housemanual
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Set up your home"
    timeout: 20000
- tapOn:
    id: "hm_onboarding_name"
- inputText: "Maple St"
- hideKeyboard
- tapOn:
    id: "hm_onboarding_type"
- tapOn: "Two-story"
- tapOn:
    id: "hm_onboarding_skip"
- extendedWaitUntil:
    visible: "More"
    timeout: 20000
