# Walkthrough H18 (claim link part, AC-H17, AC-B40): the handoff email page opens House Manual with
# homerecord://handoff/<token>. Signed out, HM-Claim asks for an account first; after the dev email code it claims the
# link. This token was never issued, so the dev backend answers 404 and the screen says the link doesn't work, with
# Close only (no Retry). The full send-then-claim path across both apps belongs in qa/flows/handoff/X02-claim-link.yaml.
# Needs the dev backend (ENVIRONMENT=dev) for /dev/last-code.
appId: com.kurtz.homerecord.housemanual
env:
  EMAIL: qa-hm-claim@example.com
  TOKEN: QaNeverIssuedHandoffToken0000000000000000000
---
- launchApp:
    clearState: true
    # The clear wipes the suite's grants; ask for notifications by name (T072c asks once reminders exist)
    permissions:
      all: allow
      notifications: allow
- runFlow: _onboard.yaml
- openLink: homerecord://handoff/${TOKEN}
# AC-H17: a claim link needs a House Manual account; the sign-in form shows under the explanation
- extendedWaitUntil:
    visible:
      id: "hm_claim_sign_in"
    timeout: 15000
- assertVisible: "Home record"
- takeScreenshot: H18b-claim-sign-in
- tapOn:
    id: "hm_sign_in_email"
- inputText: ${EMAIL}
- hideKeyboard
- tapOn:
    id: "hm_sign_in_send"
- extendedWaitUntil:
    visible:
      id: "hm_sign_in_code"
    timeout: 15000
- runScript:
    file: ../_scripts/fetch-dev-code.js
    env:
      EMAIL: ${EMAIL}
- assertTrue: ${output.devCode != null && output.devCode != ''}
- tapOn:
    id: "hm_sign_in_code"
- inputText: ${output.devCode}
- hideKeyboard
- tapOn:
    id: "hm_sign_in_verify"
# AC-B40: signed in, the claim runs; an unknown token is refused and the screen says so with Close only
- extendedWaitUntil:
    visible:
      id: "hm_claim_error"
    timeout: 20000
- assertVisible: "This link doesn't work"
- assertNotVisible:
    id: "hm_claim_retry"
- takeScreenshot: H18b-claim-not-found
- tapOn:
    id: "hm_claim_close"
- extendedWaitUntil:
    visible:
      id: "hm_tab_more"
    timeout: 10000
# AC-H18: sharing is Pro (SPEC pricing, T032b2d). This phone signed in through the claim link (free) and is on the
# free tier, so Invite family on Share this house opens HM-Paywall instead of making a link. Close lands on Home.
- tapOn:
    id: "hm_tab_more"
- scrollUntilVisible:
    element:
      id: "hm_more_share"
    direction: DOWN
- tapOn:
    id: "hm_more_share"
- extendedWaitUntil:
    visible:
      id: "hm_share_invite_editor"
    timeout: 30000
- tapOn:
    id: "hm_share_invite_editor"
- extendedWaitUntil:
    visible:
      id: "hm_paywall_reason"
    timeout: 5000
- assertVisible: "Sharing this house is part of Pro."
- takeScreenshot: H18b-share-paywall
