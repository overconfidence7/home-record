# Walkthrough H13 (T070b): open Emergency from the Home card and from More (AC-C44). Starts from the regression
# seed, which files a water main (Utility room) and a gas main (Exterior) with instructions. The quick settings
# tile (T071a, below) and the 2×1 widget (T071b, EmergencyWidgetTest; the suite cannot place a widget) open it from
# outside the app with the same open_emergency extra (AC-H11).
appId: com.kurtz.homerecord.housemanual
---
- runFlow: _seed.yaml
- tapOn:
    id: "hm_tab_home"
- scrollUntilVisible:
    element:
      id: "hm_home_emergency_open"
- tapOn:
    id: "hm_home_emergency_open"
- extendedWaitUntil:
    visible:
      id: "hm_emergency_list"
    timeout: 10000
# AC-C44: grouped Water then Gas, each main with its instructions in large type
- assertVisible:
    id: "hm_emergency_group_water"
- assertVisible: "Water main shutoff"
- assertVisible: ".*red handle on the meter side.*"
- takeScreenshot: H13-emergency
- scrollUntilVisible:
    element:
      id: "hm_emergency_group_gas"
- scrollUntilVisible:
    element: "Gas main shutoff"
- scrollUntilVisible:
    element:
      id: "hm_emergency_manage"
- assertVisible: "Manage shutoffs"
# A shutoff opens its item page, where its notes are the instructions
- scrollUntilVisible:
    element: "Gas main shutoff"
    direction: UP
- tapOn: "Gas main shutoff"
- extendedWaitUntil:
    visible:
      id: "hm_item_detail_status"
    timeout: 5000
- back
- back
# More → Emergency
- tapOn:
    id: "hm_tab_more"
- tapOn:
    id: "hm_more_emergency"
- extendedWaitUntil:
    visible:
      id: "hm_emergency_list"
    timeout: 10000
- assertVisible: "Water main shutoff"
- back
# AC-C45: the water heater links to the water main as the shutoff that isolates it; the chip opens the shutoff
- tapOn:
    id: "hm_tab_items"
- tapOn:
    id: "hm_items_search"
- inputText: "XE50T10"
- extendedWaitUntil:
    visible: "Water heater"
    timeout: 10000
- hideKeyboard
- tapOn: "Water heater"
- extendedWaitUntil:
    visible:
      id: "hm_item_detail_status"
    timeout: 5000
- scrollUntilVisible:
    element:
      id: "hm_item_detail_shutoff_pick"
- tapOn:
    id: "hm_item_detail_shutoff_pick"
- extendedWaitUntil:
    visible: "Which shutoff turns this off?"
    timeout: 5000
- tapOn: "Water main shutoff"
- extendedWaitUntil:
    visible: "Shutoff: Water main shutoff"
    timeout: 5000
- takeScreenshot: H13-item-shutoff
- tapOn: "Shutoff: Water main shutoff"
- extendedWaitUntil:
    visible: ".*red handle on the meter side.*"
    timeout: 5000
# T071a (AC-H11): the quick settings tile starts House Manual with open_emergency; a cold start with that argument
# lands on HM-Emergency over the Home tab, and Back returns to Home.
- launchApp:
    appId: com.kurtz.homerecord.housemanual
    arguments:
      open_emergency: "true"
- extendedWaitUntil:
    visible:
      id: "hm_emergency_list"
    timeout: 10000
- assertVisible: "Water main shutoff"
- takeScreenshot: H13-tile-entry
- back
- extendedWaitUntil:
    visible:
      id: "hm_tab_home"
    timeout: 5000
