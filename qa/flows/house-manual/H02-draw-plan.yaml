# Walkthrough H2: draw rooms on the plan (AC-C5, AC-C6, AC-C10, AC-C12; H03 checks the AC-C4 feet-and-inches length).
# Builds on H01 (runs it first so the home exists), then adds two rooms, undoes one, rotates.
appId: com.kurtz.homerecord.housemanual
---
- runFlow: H01-onboarding.yaml
- tapOn:
    id: "hm_tab_house"
- takeScreenshot: H02-house-tab
- tapOn:
    id: "hm_house_edit_plan"
- extendedWaitUntil:
    visible:
      id: "hm_plan_add_room"
    timeout: 15000
- takeScreenshot: H02-plan-empty
- tapOn:
    id: "hm_plan_add_room"
- assertVisible:
    id: "hm_plan_room_name"
# Fields are tapped by id (the middle of the box), not by their floated label: the label sits on the
# field's top border and, with the panel still sliding down after the keyboard closes, a tap on it can
# miss the field and the typed length goes nowhere (QA auto 0ec9040, H03 read 14' by 12').
- tapOn:
    id: "hm_plan_room_name"
- eraseText: 20
- inputText: "Kitchen"
- hideKeyboard
- tapOn:
    id: "hm_plan_room_width"
- eraseText: 10
- inputText: "14"
- assertVisible: "14"
- hideKeyboard
- tapOn:
    id: "hm_plan_room_length"
- eraseText: 10
# AC-C4: Maestro's inputText can drop quote characters on the emulator, so the flow types 12.5 (12 ft 6 in, also
# accepted per ui rule 22); `12'6"` typed into the field is covered by PlanEditorInspectorTest. The exact field text is
# asserted (the helper line "Type 12'6", 12.5 or 12 6." does not match it), and H03 reads the room back as 12' 6".
- inputText: "12.5"
- assertVisible: "12.5"
- hideKeyboard
- tapOn:
    id: "hm_plan_done"
- takeScreenshot: H02-plan-one-room
- tapOn:
    id: "hm_plan_add_room"
- tapOn:
    id: "hm_plan_room_name"
- eraseText: 20
- inputText: "Living room"
- hideKeyboard
# AC-C12: rotating keeps the selected room and its name typed but not yet committed
- setOrientation: LANDSCAPE_LEFT
- assertVisible:
    id: "hm_plan_room_name"
- assertVisible: "Living room"
- setOrientation: PORTRAIT
- assertVisible:
    id: "hm_plan_room_name"
- assertVisible: "Living room"
# The rotation keeps the name field focused with the keyboard open over Done
- hideKeyboard
- tapOn:
    id: "hm_plan_done"
- takeScreenshot: H02-plan-two-rooms
# Undo removes the last room, redo brings it back (AC-C10)
- tapOn:
    id: "hm_plan_undo"
- tapOn:
    id: "hm_plan_redo"
# Leaving the editor autosaves; the blueprint shows both rooms (AC-C13, AC-H4)
- tapOn:
    id: "hm_back"
- assertVisible: "Kitchen"
- assertVisible: "Living room"
- takeScreenshot: H02-blueprint-after-edit
# Back arrow and system back both work; no dead end (AC-U2)
- tapOn:
    id: "hm_house_edit_plan"
- back
- assertVisible:
    id: "hm_house_edit_plan"
