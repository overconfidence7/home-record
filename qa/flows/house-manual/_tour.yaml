# Helper, not a walkthrough step: visit every root tab and the first level below it, taking a
# screenshot of each. The device suite runs it under dark mode, 200% font and landscape with
# QA_VARIANT set, so the screenshots are named per variant (AC-U8, AC-U9, ui rules 24-33).
# Tabs are tapped by id: House has an "Items" layer chip that a text match would hit.
# It never clears state, so it sees whatever the previous flows left behind.
appId: com.kurtz.homerecord.housemanual
---
# No `env:` default here: a flow's own env overrides `maestro test -e`, which named every
# variant's shots tour-light-*. The variant comes from -e QA_VARIANT, light when unset.
- evalScript: ${output.variant = (typeof QA_VARIANT !== 'undefined' && QA_VARIANT) || 'light'}
- launchApp
# `settings put system user_rotation 1` left the emulator portrait; rotate from the flow instead
- runFlow:
    when:
      true: ${output.variant == 'landscape'}
    commands:
      - setOrientation: LANDSCAPE_LEFT
- extendedWaitUntil:
    visible: "Set up your home|Home"
    timeout: 20000
- runFlow:
    when:
      visible: "Set up your home"
    file: _onboard.yaml
- tapOn:
    id: "hm_tab_home"
- takeScreenshot: tour-${output.variant}-home
- tapOn:
    id: "hm_tab_house"
- takeScreenshot: tour-${output.variant}-house
- tapOn: "Floors"
- takeScreenshot: tour-${output.variant}-floors
- tapOn: "Back"
- tapOn: "Edit plan"
- takeScreenshot: tour-${output.variant}-plan-editor
- tapOn: "Back"
- tapOn:
    id: "hm_tab_items"
- takeScreenshot: tour-${output.variant}-items
- tapOn:
    id: "hm_tab_reminders"
- takeScreenshot: tour-${output.variant}-reminders
- tapOn:
    id: "hm_tab_more"
- takeScreenshot: tour-${output.variant}-more
- tapOn:
    id: "hm_tab_home"
- runFlow:
    when:
      true: ${output.variant == 'landscape'}
    commands:
      - setOrientation: PORTRAIT
