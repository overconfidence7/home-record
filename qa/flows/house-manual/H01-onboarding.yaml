# Walkthrough H1: fresh install reaches Home in at most four screens (AC-H1, AC-C1).
# Covers: onboarding fields, house type and foundation pickers, Skip for now, bottom tabs.
appId: com.kurtz.homerecord.housemanual
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Set up your home"
    timeout: 20000
- takeScreenshot: H01-onboarding
- tapOn:
    id: "hm_onboarding_name"
- inputText: "Maple St"
- hideKeyboard
- tapOn:
    id: "hm_onboarding_type"
- assertVisible: "Two-story"
- tapOn: "Two-story"
- tapOn:
    id: "hm_onboarding_foundation_basement"
- takeScreenshot: H01-onboarding-filled
- tapOn:
    id: "hm_onboarding_skip"
- extendedWaitUntil:
    visible: "More"
    timeout: 20000
# Root of the app: the five tabs from SPEC 5.1 (AC-U1)
- assertVisible: "Home"
- assertVisible: "House"
- assertVisible: "Items"
- assertVisible: "Reminders"
- assertVisible: "More"
- takeScreenshot: H01-home-after-onboarding
# Focus guard: House Manual never shows Field Log concepts
- assertNotVisible: "Clock"
- assertNotVisible: "Jobs"
