# Walkthrough H12 (first part, T066b): open the seeded Main panel item and its slots (AC-C40). Starts from the
# regression seed (_seed.yaml), which files a Square D breaker panel named "Main panel". Labeling breakers and the
# fridge's "Breaker 12" link (T067b1, AC-C41, AC-H7) extend this flow.
appId: com.kurtz.homerecord.housemanual
---
- runFlow: _seed.yaml
- tapOn:
    id: "hm_tab_items"
- extendedWaitUntil:
    visible:
      id: "hm_items_row_.*"
    timeout: 15000
- tapOn:
    id: "hm_items_search"
- inputText: "QO140M200"
- extendedWaitUntil:
    visible: "Main panel"
    timeout: 10000
- hideKeyboard
- tapOn: "Main panel"
- extendedWaitUntil:
    visible:
      id: "hm_item_detail_status"
    timeout: 5000
# AC-C40: a Breaker panel item has a Panel section that opens its slots
- scrollUntilVisible:
    element:
      id: "hm_item_detail_panel"
- tapOn:
    id: "hm_item_detail_panel"
- extendedWaitUntil:
    visible:
      id: "hm_panel_grid"
    timeout: 10000
# The panel is made on first open with 40 slots in two columns
- assertVisible: "40 slots, two columns"
- assertVisible:
    id: "hm_panel_slot_1"
- assertVisible:
    id: "hm_panel_slot_2"
- takeScreenshot: H12-panel
- scrollUntilVisible:
    element:
      id: "hm_panel_slot_40"
- tapOn:
    id: "hm_back"
- extendedWaitUntil:
    visible:
      id: "hm_item_detail_panel"
    timeout: 5000
# T066b2: the seeded home has one panel, so More → Breaker panels opens it straight
- tapOn:
    id: "hm_tab_more"
- extendedWaitUntil:
    visible:
      id: "hm_more_panels"
    timeout: 5000
- tapOn:
    id: "hm_more_panels"
- extendedWaitUntil:
    visible:
      id: "hm_panel_grid"
    timeout: 10000
- assertVisible: "Main panel"
# T066c: tap an open slot to label its breaker (HM-Breaker), save, and the slot shows it
- scrollUntilVisible:
    element:
      id: "hm_panel_slot_12"
- tapOn:
    id: "hm_panel_slot_12"
- extendedWaitUntil:
    visible:
      id: "hm_breaker_form"
    timeout: 5000
- assertVisible: "Slot 12"
- tapOn:
    id: "hm_breaker_label"
- inputText: "Refrigerator"
- tapOn:
    id: "hm_breaker_amps"
- inputText: "20"
- hideKeyboard
- tapOn:
    id: "hm_breaker_save"
- extendedWaitUntil:
    visible: "Refrigerator"
    timeout: 5000
- assertNotVisible:
    id: "hm_breaker_form"
- takeScreenshot: H12-breaker-labeled
# Touch and hold the breaker to add a tandem in the same slot; close without saving
- longPressOn:
    id: "hm_panel_slot_12"
- extendedWaitUntil:
    visible: "Slot 12, tandem"
    timeout: 5000
- tapOn:
    id: "hm_close"
- extendedWaitUntil:
    visible:
      id: "hm_panel_grid"
    timeout: 5000
# T066c2: panel details (main amps and brand) and the panel photo sheet
- tapOn:
    id: "hm_panel_edit"
- extendedWaitUntil:
    visible:
      id: "hm_panel_facts_form"
    timeout: 5000
- tapOn:
    id: "hm_panel_facts_main"
- eraseText
- inputText: "200"
- hideKeyboard
- tapOn:
    id: "hm_panel_facts_save"
- extendedWaitUntil:
    visible: "200 A main"
    timeout: 5000
- tapOn:
    id: "hm_panel_photo"
- extendedWaitUntil:
    visible: "Take photo"
    timeout: 5000
- assertVisible: "Choose photo"
- back
- extendedWaitUntil:
    visible:
      id: "hm_panel_grid"
    timeout: 5000
# T067b1: link the fridge to breaker 12, then the fridge page shows "Breaker 12" (AC-C41) and the chip opens the
# panel scrolled to slot 12 with it outlined for 2 s (AC-H7)
- scrollUntilVisible:
    element:
      id: "hm_panel_slot_12"
- tapOn:
    id: "hm_panel_slot_12"
- extendedWaitUntil:
    visible:
      id: "hm_breaker_form"
    timeout: 5000
- scrollUntilVisible:
    element:
      id: "hm_breaker_items_chip"
      text: "Refrigerator"
- tapOn:
    id: "hm_breaker_items_chip"
    text: "Refrigerator"
- tapOn:
    id: "hm_breaker_save"
- extendedWaitUntil:
    notVisible:
      id: "hm_breaker_form"
    timeout: 5000
- tapOn:
    id: "hm_back"
- tapOn:
    id: "hm_tab_items"
- extendedWaitUntil:
    visible:
      id: "hm_items_search"
    timeout: 5000
- tapOn:
    id: "hm_items_search"
- eraseText
- inputText: "LRMVS3006S"
- extendedWaitUntil:
    visible: "Refrigerator"
    timeout: 10000
- hideKeyboard
- tapOn: "Refrigerator"
- extendedWaitUntil:
    visible:
      id: "hm_item_detail_status"
    timeout: 5000
- scrollUntilVisible:
    element:
      id: "hm_item_detail_power"
- assertVisible: "Breaker 12"
- takeScreenshot: H12-fridge-breaker
- tapOn: "Breaker 12"
- extendedWaitUntil:
    visible:
      id: "hm_panel_slot_12"
    timeout: 10000
- assertVisible: "Main panel"
- takeScreenshot: H12-panel-highlight
