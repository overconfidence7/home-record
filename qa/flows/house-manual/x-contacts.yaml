# Not a walkthrough step (x- prefix): Contacts from the More tab (AC-C39). Needs a home, so it starts from the onboarding helper.
appId: com.kurtz.homerecord.housemanual
---
- runFlow: _onboard.yaml
- tapOn: "More"
- tapOn:
    id: "hm_more_contacts"
- assertVisible: "No contacts yet"
- tapOn:
    id: "hm_contacts_add"
- tapOn:
    id: "hm_contacts_save"
- assertVisible: "Required."
- tapOn:
    id: "hm_contacts_name"
- inputText: "Maria Soto"
- hideKeyboard
- tapOn:
    id: "hm_contacts_save"
- assertVisible: "Maria Soto"
- takeScreenshot: x-contacts
# AC-U6 (cr:form-dialog): a typed-in form asks before Close throws it away; Keep editing keeps the text
- tapOn:
    id: "hm_contacts_fab"
- tapOn:
    id: "hm_contacts_name"
- inputText: "Dale Harlan"
- hideKeyboard
- tapOn:
    id: "hm_close"
- extendedWaitUntil:
    visible: "Discard changes?"
    timeout: 5000
- tapOn:
    id: "hm_keep_editing"
- assertVisible: "Dale Harlan"
- tapOn:
    id: "hm_close"
- tapOn:
    id: "hm_discard"
- assertVisible: "Maria Soto"
- assertNotVisible: "Dale Harlan"
# AC-U3 (cr:card-lists): a contact is a list row; tapping it opens Edit contact
- tapOn:
    id: "hm_contacts_row"
- extendedWaitUntil:
    visible: "Edit contact"
    timeout: 5000
- tapOn:
    id: "hm_close"
- assertVisible: "Maria Soto"
