# Helper, not a walkthrough step: the setup half of _3d-perf (T050b). Seeds the 3D reference home and opens
# House > 3D view on its Main floor. The device suite runs this first and starts screenrecord only afterwards, so
# 3d/orbit.mp4 shows the scene and the orbit instead of the launcher and the seed ([judge:qa-3d-orbit-video-misses-scene]).
appId: com.kurtz.homerecord.housemanual
---
- launchApp:
    clearState: true
    # The clear wipes the suite's grants; ask for notifications by name (T072c asks once reminders exist)
    permissions:
      all: allow
      notifications: allow
- stopApp
- openLink: "homerecord-qa-hm://seed?scenario=3d-reference"
- extendedWaitUntil:
    visible:
      id: "hm_tab_house"
    timeout: 60000
- tapOn:
    id: "hm_tab_house"
- scrollUntilVisible:
    element:
      id: "hm_house_3d"
- tapOn:
    id: "hm_house_3d"
# AC-C24: the reference home opens in 3D with its photographed walls, then every floor at once
- extendedWaitUntil:
    visible:
      id: "hm_3d_reset"
    timeout: 15000
- assertVisible:
    id: "hm_3d_scene"
