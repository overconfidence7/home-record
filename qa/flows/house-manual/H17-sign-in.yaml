# Walkthrough H17: signing in with an email code from the More tab (AC-H15 sign-in part, AC-B1).
# Needs the dev backend (ENVIRONMENT=dev, PLAN Q005) for /dev/last-code. Env EMAIL defaults below.
# The second-device part of AC-H15 lands with T075d; delete cloud copy (T075c) is the last block.
appId: com.kurtz.homerecord.housemanual
env:
  EMAIL: qa-hm@example.com
---
- launchApp:
    clearState: true
    # The clear wipes the suite's grants; ask for notifications by name (T072c asks once reminders exist)
    permissions:
      all: allow
      notifications: allow
- runFlow: _onboard.yaml
# AC-H18: on the free tier, Sign in on HM-Account opens HM-Paywall with the sync reason (T032b2b)
- tapOn: "More"
- scrollUntilVisible:
    element:
      id: "hm_more_account"
    direction: DOWN
- tapOn:
    id: "hm_more_account"
- extendedWaitUntil:
    visible:
      id: "hm_account_sign_in_pro"
    timeout: 5000
- assertNotVisible:
    id: "hm_sign_in_email"
- takeScreenshot: H17-free-sign-in
- tapOn:
    id: "hm_account_sign_in_pro"
- extendedWaitUntil:
    visible:
      id: "hm_paywall_reason"
    timeout: 5000
- assertVisible: "Cloud backup and sign in are part of Pro."
- takeScreenshot: H17-paywall-sync
# Pro on (debug seed, no store key on QA builds); the app reopens on Home
- runFlow: _pro.yaml
- tapOn: "More"
# AC-H15: More → Account and sync opens HM-Account (T075b)
- scrollUntilVisible:
    element:
      id: "hm_more_account"
    direction: DOWN
- tapOn:
    id: "hm_more_account"
- extendedWaitUntil:
    visible: "Account and sync"
    timeout: 5000
- assertVisible: "Sign in"
- tapOn:
    id: "hm_sign_in_email"
- inputText: ${EMAIL}
- hideKeyboard
- tapOn:
    id: "hm_sign_in_send"
- extendedWaitUntil:
    visible:
      id: "hm_sign_in_code"
    timeout: 15000
- runScript:
    file: ../_scripts/fetch-dev-code.js
    env:
      EMAIL: ${EMAIL}
- assertTrue: ${output.devCode != null && output.devCode != ''}
- tapOn:
    id: "hm_sign_in_code"
- inputText: ${output.devCode}
- hideKeyboard
# AC-H15 (sign-in part): the code signs in and Sign out appears
- tapOn:
    id: "hm_sign_in_verify"
- extendedWaitUntil:
    visible:
      id: "hm_account_sign_out"
    timeout: 15000
# AC-H15: signing in uploads the home; the first pass registers it on the server and ends synced
# (judge:hm-signin-sync-failed)
- extendedWaitUntil:
    visible: "Everything is synced"
    timeout: 30000
- assertNotVisible: "Sync failed. Tap to retry"
# judge:hm-more-signed-in-no-account: the panel names the account that holds the backup
- assertVisible:
    id: "hm_account_email"
    text: "Signed in as ${EMAIL}"
# AC-H15: HM-Account says what sync does
- assertVisible:
    id: "hm_account_sync_explainer"
- takeScreenshot: H17-signed-in
# Signing out asks first, then keeps the local copy (AC-H15)
- tapOn:
    id: "hm_account_sign_out"
- extendedWaitUntil:
    visible:
      id: "hm_account_sign_out_confirm"
    timeout: 5000
- assertVisible: "Sign out?"
- tapOn:
    id: "hm_account_sign_out_confirm"
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 10000
- tapOn:
    id: "hm_tab_home"
- assertVisible:
    id: "hm_home_title"
    text: "Maple St"
- takeScreenshot: H17-local-copy-kept
# Delete cloud copy (T075c): sign in again, delete the cloud copy, the app signs out and keeps the home
- tapOn: "More"
- scrollUntilVisible:
    element:
      id: "hm_more_account"
    direction: DOWN
- tapOn:
    id: "hm_more_account"
- extendedWaitUntil:
    visible:
      id: "hm_sign_in_email"
    timeout: 5000
- tapOn:
    id: "hm_sign_in_email"
- eraseText
- inputText: ${EMAIL}
- hideKeyboard
- tapOn:
    id: "hm_sign_in_send"
- extendedWaitUntil:
    visible:
      id: "hm_sign_in_code"
    timeout: 15000
- runScript:
    file: ../_scripts/fetch-dev-code.js
    env:
      EMAIL: ${EMAIL}
- tapOn:
    id: "hm_sign_in_code"
- inputText: ${output.devCode}
- hideKeyboard
- tapOn:
    id: "hm_sign_in_verify"
- extendedWaitUntil:
    visible: "Everything is synced"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "hm_account_delete_cloud"
    direction: DOWN
- tapOn:
    id: "hm_account_delete_cloud"
- extendedWaitUntil:
    visible:
      id: "hm_account_delete_cloud_confirm"
    timeout: 5000
# AC-H15: deleting the cloud copy asks first, then signs out and keeps the local copy
- assertVisible: "Delete cloud copy?"
- tapOn:
    id: "hm_account_delete_cloud_confirm"
- extendedWaitUntil:
    visible:
      id: "hm_account_cloud_deleted"
    timeout: 15000
- assertVisible: "Sign in"
- assertNotVisible:
    id: "hm_account_delete_cloud_error"
- takeScreenshot: H17-cloud-deleted
- tapOn:
    id: "hm_back"
- tapOn:
    id: "hm_tab_home"
- assertVisible:
    id: "hm_home_title"
    text: "Maple St"
