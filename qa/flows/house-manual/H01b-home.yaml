# Walkthrough H1: lands on HM-Home on a fresh home (AC-H1, AC-H2, AC-H3): the three quick actions, the emergency card and the one-line attention state.
appId: com.kurtz.homerecord.housemanual
---
- runFlow: _onboard.yaml
# AC-H1: the Home empty state offers the quick actions and the emergency card
- assertVisible:
    id: "hm_home_add_item"
- assertVisible:
    id: "hm_home_scan_plate"
- assertVisible:
    id: "hm_home_emergency"
# AC-H2: with nothing to show, Needs attention is one line, not an empty card
- assertVisible:
    id: "hm_home_attention_none"
# AC-H3 (no match; H04 searches a real item): a search with no match says so, clearing it brings Home back
- tapOn:
    id: "hm_home_search"
- inputText: "zzzz"
- assertVisible:
    id: "hm_home_search_none"
- tapOn:
    id: "hm_home_search_clear"
- assertVisible:
    id: "hm_home_add_item"
- tapOn:
    id: "hm_home_add_item"
- assertVisible: "Add item"
