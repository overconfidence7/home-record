# Walkthrough F3: create a job, see it on Overview, start its plan on the House tab (AC-F5, AC-F7, AC-F48).
appId: com.kurtz.homerecord.fieldlog
---
- launchApp:
    clearState: true
- runFlow:
    file: _owner-company.yaml
    env:
      EMAIL: "qa-owner-f03@example.test"
- tapOn: "Jobs"
- tapOn:
    id: fl_jobs_new
- tapOn:
    id: fl_jobedit_name
- inputText: "Garage subpanel"
- hideKeyboard
- tapOn:
    id: fl_jobedit_client
- inputText: "Rivera"
- hideKeyboard
- tapOn:
    id: fl_jobedit_client_phone
- inputText: "9375550142"
- hideKeyboard
- tapOn:
    id: fl_jobedit_client_email
- inputText: "ana.rivera@example.com"
- hideKeyboard
- tapOn:
    id: fl_jobedit_address
- inputText: "12 Oak St"
- hideKeyboard
# AC-F5: the new job with client and address saves and is listed; its Overview shows both
- tapOn:
    id: fl_save
- extendedWaitUntil:
    visible: "Garage subpanel"
    timeout: 10000
- tapOn: "Garage subpanel"
- assertVisible: "Rivera"
- assertVisible:
    id: fl_job_address
    text: "12 Oak St"
# AC-F7: Overview shows hours this week, photos, open tasks, the next scheduled day and the crew
- assertVisible:
    id: fl_job_stat_hours
- assertVisible:
    id: fl_job_stat_photos
- scrollUntilVisible:
    element:
      id: fl_job_stat_tasks
- scrollUntilVisible:
    element:
      id: fl_job_next_day
- scrollUntilVisible:
    element:
      id: fl_job_crew
- takeScreenshot: F03-job-overview
# The sub-tab row scrolls and keeps the selected tab in view, so step along it by id (Files, then Time)
# instead of swiping at fixed coordinates; Files is the fourth tab and fits on the narrowest phone
- tapOn:
    id: fl_job_tab_files
- extendedWaitUntil:
    visible:
      id: fl_job_tab_time
    timeout: 5000
- tapOn:
    id: fl_job_tab_time
- extendedWaitUntil:
    visible:
      id: fl_job_tab_house
    timeout: 5000
# AC-F48: the job's House tab starts the same plan editor House Manual uses
- tapOn:
    id: fl_job_tab_house
- extendedWaitUntil:
    visible: "Start the plan"
    timeout: 5000
- takeScreenshot: F03-job-house-empty
- tapOn:
    id: fl_jobhouse_start
- extendedWaitUntil:
    visible: "Main"
    timeout: 10000
