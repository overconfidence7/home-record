# Walkthrough F15: Owner opens Reports from More (tabs Hours, Photos, Summaries); an empty range says so in one row, the range chips work, exports are shown but disabled until there are hours; Photo reports lists each job with its photos in the range (AC-F28); a job's summary PDF goes to the share sheet (AC-F15, AC-F46, AC-F47).
appId: com.kurtz.homerecord.fieldlog
---
- launchApp:
    clearState: true
- runFlow:
    file: _owner-company.yaml
    env:
      EMAIL: "qa-owner-f15@example.test"
- tapOn: "More"
- tapOn:
    id: fl_more_reports
- extendedWaitUntil:
    visible:
      id: fl_reports_empty
    timeout: 10000
# AC-F15 (export part): an empty range says so; the shifts CSV and the QuickBooks export are offered, disabled with nothing to send
- tapOn:
    id: fl_reports_range_LastFourWeeks
- assertVisible:
    id: fl_reports_empty
- assertVisible: "No hours in these dates"
- assertVisible:
    id: fl_reports_export_shifts
    enabled: false
- assertVisible:
    id: fl_reports_export_quickbooks
    enabled: false
# AC-F47: Job summaries is its own tab; with no job it says so
- tapOn:
    id: fl_reports_tab_Summaries
- extendedWaitUntil:
    visible: "No jobs yet."
    timeout: 10000
- assertVisible: "Job summaries"
# with a job, Job summaries lists it; tapping it makes the job summary PDF and opens the share sheet
- back
- tapOn: "Jobs"
- tapOn:
    id: fl_jobs_new
- tapOn:
    id: fl_jobedit_name
- inputText: "Hale kitchen"
- hideKeyboard
- tapOn:
    id: fl_save
- extendedWaitUntil:
    visible: "Hale kitchen"
    timeout: 10000
- tapOn: "More"
- tapOn:
    id: fl_more_reports
- extendedWaitUntil:
    visible:
      id: fl_reports_list
    timeout: 10000
# AC-F28: Photo reports (Photos tab) lists the job with its photo count for the range; with none it is not a link
- tapOn:
    id: fl_reports_tab_Photos
- extendedWaitUntil:
    visible: "No photos in these dates"
    timeout: 10000
- assertVisible: "Photo reports"
- takeScreenshot: F15-photo-reports
- tapOn:
    id: fl_reports_tab_Summaries
- extendedWaitUntil:
    visible:
      id: "fl_reports_summary_.*"
    timeout: 10000
- assertVisible: "Job summaries"
- takeScreenshot: F15-job-summaries
- tapOn:
    id: "fl_reports_summary_.*"
# the system share sheet is on top; leave it like a person who picked nothing
- back
- extendedWaitUntil:
    visible: "Job summaries"
    timeout: 10000
- assertNotVisible:
    id: fl_reports_summary_failed
