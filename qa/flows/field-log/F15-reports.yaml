# Walkthrough F15: Owner opens Reports from More; an empty range says so, the range chips work, exports are shown but disabled until there are hours (AC-F15, AC-F46).
appId: com.kurtz.homerecord.fieldlog
---
- launchApp:
    clearState: true
- runFlow:
    file: _owner-company.yaml
    env:
      EMAIL: "qa-owner-f15@example.test"
- tapOn: "More"
- tapOn:
    id: fl_more_reports
- extendedWaitUntil:
    visible:
      id: fl_reports_empty
    timeout: 10000
# AC-F15 (export part): an empty range says so; the shifts CSV and the QuickBooks export are offered, disabled with nothing to send
- tapOn:
    id: fl_reports_range_LastFourWeeks
- assertVisible:
    id: fl_reports_empty
- assertVisible: "No hours in these dates"
- assertVisible:
    id: fl_reports_export_shifts
    enabled: false
- assertVisible:
    id: fl_reports_export_quickbooks
    enabled: false
