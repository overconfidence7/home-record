# Walkthrough F15: Owner opens Reports from More; an empty range says so, the range chips work, exports are shown but disabled until there are hours; a job's summary PDF goes to the share sheet (AC-F15, AC-F46, AC-F47).
appId: com.kurtz.homerecord.fieldlog
---
- launchApp:
    clearState: true
- runFlow:
    file: _owner-company.yaml
    env:
      EMAIL: "qa-owner-f15@example.test"
- tapOn: "More"
- tapOn:
    id: fl_more_reports
- extendedWaitUntil:
    visible:
      id: fl_reports_empty
    timeout: 10000
# AC-F15 (export part): an empty range says so; the shifts CSV and the QuickBooks export are offered, disabled with nothing to send
- tapOn:
    id: fl_reports_range_LastFourWeeks
- assertVisible:
    id: fl_reports_empty
- assertVisible: "No hours in these dates"
- assertVisible:
    id: fl_reports_export_shifts
    enabled: false
- assertVisible:
    id: fl_reports_export_quickbooks
    enabled: false
# AC-F47: Job summaries sits under the delays; with no job it says so
- scrollUntilVisible:
    element: "No jobs yet."
# with a job, Job summaries lists it; tapping it makes the job summary PDF and opens the share sheet
- back
- tapOn: "Jobs"
- tapOn:
    id: fl_jobs_new
- tapOn:
    id: fl_jobedit_name
- inputText: "Hale kitchen"
- hideKeyboard
- tapOn:
    id: fl_save
- extendedWaitUntil:
    visible: "Hale kitchen"
    timeout: 10000
- tapOn: "More"
- tapOn:
    id: fl_more_reports
- extendedWaitUntil:
    visible:
      id: fl_reports_list
    timeout: 10000
- scrollUntilVisible:
    element: "Hale kitchen"
- assertVisible: "Job summaries"
- takeScreenshot: F15-job-summaries
- tapOn: "Hale kitchen"
# the system share sheet is on top; leave it like a person who picked nothing
- back
- extendedWaitUntil:
    visible: "Job summaries"
    timeout: 10000
- assertNotVisible:
    id: fl_reports_summary_failed
