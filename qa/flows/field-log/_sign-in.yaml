# Subflow: sign in with the email code from the dev backend. Needs env EMAIL.
appId: com.kurtz.homerecord.fieldlog
---
- tapOn:
    id: "fl_sign_in_email"
- inputText: ${EMAIL}
- hideKeyboard
- tapOn:
    id: "fl_sign_in_send"
- extendedWaitUntil:
    visible:
      id: "fl_sign_in_code"
    timeout: 15000
- runScript:
    file: ../_scripts/fetch-dev-code.js
    env:
      EMAIL: ${EMAIL}
- assertTrue: ${output.devCode != null && output.devCode != ''}
- tapOn:
    id: "fl_sign_in_code"
- inputText: ${output.devCode}
- hideKeyboard
- tapOn:
    id: "fl_sign_in_verify"
