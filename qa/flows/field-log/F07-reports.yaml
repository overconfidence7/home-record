# Walkthrough F7: Owner opens Reports from More; an empty range says so, the range chips work, exports are offered (AC-F15, AC-F46).
appId: com.kurtz.homerecord.fieldlog
---
- launchApp:
    clearState: true
- runFlow:
    file: _sign-in.yaml
    env:
      EMAIL: "qa-owner-f07@example.test"
- extendedWaitUntil:
    visible: "Set up your company"
    timeout: 15000
- tapOn: "Create"
- tapOn:
    id: "fl_welcome_name"
- inputText: "QA Electric"
- hideKeyboard
- tapOn:
    id: "fl_welcome_trade"
- inputText: "Electrical"
- hideKeyboard
- tapOn: "Create company"
- extendedWaitUntil:
    visible: "Today"
- tapOn: "More"
- tapOn:
    id: fl_more_reports
- extendedWaitUntil:
    visible:
      id: fl_reports_empty
    timeout: 10000
- tapOn:
    id: fl_reports_range_LastFourWeeks
- assertVisible:
    id: fl_reports_empty
- assertVisible:
    id: fl_reports_export_shifts
- assertVisible:
    id: fl_reports_export_quickbooks
