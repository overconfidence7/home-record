# Walkthrough F2: invite a crew member, role gates, sign-out (AC-F2, AC-F3, AC-F4).
# One emulator plays both people: the Owner creates the company and copies the invite code,
# signs out, then a second account joins as Crew and sees no admin screens.
appId: com.kurtz.homerecord.fieldlog
---
- launchApp:
    clearState: true
- runFlow:
    file: _owner-company.yaml
    env:
      EMAIL: "qa-owner-f02@example.test"
# Owner sees Team and Company on More (AC-F3)
- tapOn:
    id: "fl_tab_more"
- assertVisible:
    id: "fl_more_team"
- assertVisible:
    id: "fl_more_company"
# AC-F2: the Owner's Team page shows the invite code to share
- tapOn:
    id: "fl_more_team"
- assertVisible: "Invite code"
- assertVisible:
    id: "fl_team_code"
- copyTextFrom:
    id: "fl_team_code"
- takeScreenshot: F02-team-owner
- tapOn:
    id: "fl_back"
# Sign-in survives a restart (AC-F4)
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "fl_tab_today"
    timeout: 15000
# Sign out asks first, then clears the company (AC-F4)
- tapOn:
    id: "fl_tab_more"
- tapOn:
    id: "fl_more_sign_out"
- assertVisible:
    id: "fl_more_sign_out_body"
- tapOn:
    id: "fl_more_sign_out_confirm"
- assertVisible:
    id: "fl_sign_in_email"
# AC-F2 (join part): a second account joins with the code and lands on Today
- runFlow:
    file: _sign-in.yaml
    env:
      EMAIL: "qa-crew-f02@example.test"
- extendedWaitUntil:
    visible:
      id: "fl_welcome_mode_join"
    timeout: 15000
- tapOn:
    id: "fl_welcome_mode_join"
- tapOn:
    id: "fl_welcome_code"
- pasteText
- hideKeyboard
- tapOn:
    id: "fl_welcome_submit"
- extendedWaitUntil:
    visible:
      id: "fl_tab_today"
    timeout: 15000
# Crew cannot add a job (AC-F3: no New job button at all)
- tapOn:
    id: "fl_tab_jobs"
- extendedWaitUntil:
    visible: "Jobs"
    timeout: 10000
- assertNotVisible:
    id: "fl_jobs_new"
# Crew cannot see Team or Company (AC-F3: hidden, not greyed out)
- tapOn:
    id: "fl_tab_more"
- extendedWaitUntil:
    visible:
      id: "fl_more_sign_out"
    timeout: 10000
- assertNotVisible:
    id: "fl_more_team"
- assertNotVisible:
    id: "fl_more_company"
- takeScreenshot: F02-more-crew
