# Walkthrough F7: Files tab on a job: empty state, new folder, open it, search by name (AC-F19, AC-F23).
appId: com.kurtz.homerecord.fieldlog
---
- launchApp:
    clearState: true
- runFlow:
    file: _owner-company.yaml
    env:
      EMAIL: "qa-owner-f07@example.test"
- tapOn: "Jobs"
- tapOn:
    id: fl_jobs_new
- tapOn:
    id: fl_jobedit_name
- inputText: "Garage subpanel"
- hideKeyboard
- tapOn:
    id: fl_save
- tapOn: "Garage subpanel"
- tapOn:
    id: fl_job_tab_files
- extendedWaitUntil:
    visible:
      id: fl_files_empty
    timeout: 10000
# rule 10/13: the empty state's one action opens the same FAB menu as the + button
- assertVisible: "No files yet"
- tapOn:
    id: fl_files_empty_add
- assertVisible:
    id: fl_files_add
# AC-F23: a new folder is listed and opens with a way back up
- tapOn:
    id: fl_files_new_folder
- tapOn:
    id: fl_files_name
- inputText: "Permits"
- hideKeyboard
- tapOn:
    id: fl_files_name_ok
- extendedWaitUntil:
    visible:
      id: fl_files_folder_Permits
    timeout: 10000
- tapOn:
    id: fl_files_folder_Permits
- assertVisible:
    id: fl_files_up
# AC-F23: search by file name says when nothing matches
- tapOn:
    id: fl_files_search
- inputText: "nothing"
- assertVisible:
    id: fl_files_no_match
