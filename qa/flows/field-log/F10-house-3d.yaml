# Walkthrough F10 (T049c): FL-House in 3D (AC-C20). Builds a one-room plan on a new job (House tab: Start the
# plan, Edit plan, Add room "Kitchen"), then opens "3D view" from the House tab: the scene, Reset view and the
# stage picker opening on Rough-in (Field Log's behind-the-wall default); Back returns to the House tab.
# T051 (AC-C22): the Kitchen room page's "View in 3D" stands the camera inside the room; Back to floor leaves it.
# T052b2 (AC-C18, AC-C25, AC-C26): behind-the-wall capture on the Kitchen's North wall from the gallery
# (`qa/fixtures/wall-rough-in.jpg`; the picker is another app, so its steps run only when it shows the fixture), then a
# wire run and a drain drawn on that wall at Rough-in, the drain with its own photo; the installed item arrives with the
# F10 item work.
# Stage buttons are radio buttons to accessibility, so the chosen stage is asserted as `checked` (not `selected`).
appId: com.kurtz.homerecord.fieldlog
---
- addMedia:
    - "../../fixtures/wall-rough-in.jpg"
- launchApp:
    clearState: true
- runFlow:
    file: _owner-company.yaml
    env:
      EMAIL: "qa-owner-f10@example.test"
- tapOn: "Jobs"
- tapOn:
    id: fl_jobs_new
- tapOn:
    id: fl_jobedit_name
- inputText: "Hale kitchen"
- hideKeyboard
- tapOn:
    id: fl_save
- tapOn: "Hale kitchen"
# House is the seventh of eight sub-tabs and starts off screen on a phone; the row keeps the selected
# tab in view, so step along it by id (Files, then Time) the way F03 does instead of swiping
- extendedWaitUntil:
    visible:
      id: fl_job_tab_files
    timeout: 10000
- tapOn:
    id: fl_job_tab_files
- extendedWaitUntil:
    visible:
      id: fl_job_tab_time
    timeout: 5000
- tapOn:
    id: fl_job_tab_time
- extendedWaitUntil:
    visible:
      id: fl_job_tab_house
    timeout: 5000
- tapOn:
    id: fl_job_tab_house
- tapOn:
    id: fl_jobhouse_start
- extendedWaitUntil:
    visible:
      id: fl_house_edit_plan
    timeout: 10000
- tapOn:
    id: fl_house_edit_plan
- extendedWaitUntil:
    visible:
      id: fl_plan_add_room
    timeout: 15000
- tapOn:
    id: fl_plan_add_room
- tapOn:
    id: fl_plan_room_name
- eraseText: 20
- inputText: "Kitchen"
- hideKeyboard
- tapOn:
    id: fl_plan_done
- tapOn:
    id: fl_back
- extendedWaitUntil:
    visible: "Kitchen"
    timeout: 10000
# AC-C20: "3D view" opens the job's floor in 3D with Reset view and the stage selector on Rough-in
- scrollUntilVisible:
    element:
      id: "fl_house_3d"
- tapOn:
    id: "fl_house_3d"
- extendedWaitUntil:
    visible:
      id: "fl_3d_reset"
    timeout: 15000
- assertVisible:
    id: "fl_3d_scene"
- assertVisible:
    id: "fl_3d_stage_rough_in"
    checked: true
- assertVisible:
    id: "fl_3d_walls"
- tapOn:
    id: "fl_3d_reset"
- takeScreenshot: F10-3d
- tapOn:
    id: "fl_back"
- extendedWaitUntil:
    visible:
      id: "fl_house_3d"
    timeout: 5000
# AC-C22: the job's room page opens the room in 3D standing inside it; Back to floor shows the whole floor
- tapOn: "Kitchen"
- scrollUntilVisible:
    element:
      id: "fl_room_view_3d"
    direction: UP
- tapOn:
    id: "fl_room_view_3d"
- extendedWaitUntil:
    visible: "Kitchen in 3D"
    timeout: 15000
- assertVisible:
    id: "fl_3d_stage_rough_in"
    checked: true
- takeScreenshot: F10-3d-room
- tapOn:
    id: "fl_3d_back_to_floor"
- extendedWaitUntil:
    visible:
      id: "fl_3d_reset"
    timeout: 15000
- assertNotVisible:
    id: "fl_3d_back_to_floor"
- tapOn:
    id: "fl_back"
- tapOn:
    id: "fl_back"
# AC-C18: behind-the-wall photo of the Kitchen's North wall at Rough-in, chosen from the gallery and outlined
- extendedWaitUntil:
    visible:
      id: "fl_house_3d"
    timeout: 10000
- tapOn: "Kitchen"
- scrollUntilVisible:
    element: "North wall"
- tapOn:
    text: "Photograph"
    index: 0
- extendedWaitUntil:
    visible:
      id: "fl_sheet_wall_choose"
    timeout: 10000
- tapOn:
    id: "fl_sheet_wall_choose"
- runFlow:
    when:
      visible: "Photo taken on.*"
    commands:
      - tapOn:
          text: "Photo taken on.*"
          index: 0
- runFlow:
    when:
      visible:
        id: "fl_wall_outline_use"
    commands:
      - tapOn:
          id: "fl_wall_outline_use"
      - extendedWaitUntil:
          visible: ".*Photos: Rough-in"
          timeout: 15000
      - takeScreenshot: F10-wall-rough-in-photo
# The picker may leave the app behind it; come back to the room either way
- runFlow:
    when:
      notVisible: "North wall"
    commands:
      - pressKey: back
- scrollUntilVisible:
    element: "North wall"
# AC-C25: a wire run on the wall at Rough-in
- tapOn: "North wall"
- extendedWaitUntil:
    visible:
      id: "fl_wall_add_overlay"
    timeout: 10000
- assertVisible:
    id: "fl_wall_stage_rough_in"
    checked: true
- tapOn:
    id: "fl_wall_add_overlay"
- tapOn:
    id: "fl_wall_picture"
- tapOn:
    point: "80%,25%"
- assertVisible: "2 points.*"
- tapOn:
    id: "fl_wall_draw_next"
- extendedWaitUntil:
    visible: "New overlay"
    timeout: 10000
- tapOn:
    id: "fl_overlay_form_kind"
- scrollUntilVisible:
    element:
      id: "fl_overlay_kind_electrical_wire"
- tapOn:
    id: "fl_overlay_kind_electrical_wire"
- tapOn:
    id: "fl_overlay_form_label"
- inputText: "Range circuit"
- hideKeyboard
- tapOn:
    id: "fl_save"
- extendedWaitUntil:
    visible:
      id: "fl_wall_selection"
    timeout: 10000
- assertVisible: "Range circuit"
- assertVisible: "Electrical wire · Behind drywall · Rough-in stage"
- tapOn:
    id: "fl_wall_overlay_done"
# AC-C25, AC-C26: a drain run with its own photo (camera or gallery) and depth
- tapOn:
    id: "fl_wall_add_overlay"
# Both taps must land on fl_wall_picture: with the Rough-in photo it spans
# y 472-1136 of 2400 (20%-47%) on the 1080x2400 emulator; 60% was below it.
# x 25% stays clear of the wire run drawn above (x 50%-80%).
- tapOn:
    point: "25%,28%"
- tapOn:
    point: "25%,42%"
- assertVisible: "2 points.*"
- tapOn:
    id: "fl_wall_draw_next"
- extendedWaitUntil:
    visible: "New overlay"
    timeout: 10000
- tapOn:
    id: "fl_overlay_form_kind"
- scrollUntilVisible:
    element:
      id: "fl_overlay_kind_drain"
- tapOn:
    id: "fl_overlay_kind_drain"
- tapOn:
    id: "fl_overlay_form_label"
- inputText: "Sink drain"
- hideKeyboard
- assertVisible:
    id: "fl_overlay_form_item"
- scrollUntilVisible:
    element:
      id: "fl_overlay_form_photo_add"
- tapOn:
    id: "fl_overlay_form_photo_add"
- extendedWaitUntil:
    visible:
      id: "fl_sheet_overlay_photo_choose"
    timeout: 10000
- assertVisible:
    id: "fl_sheet_overlay_photo_take"
- tapOn:
    id: "fl_sheet_overlay_photo_choose"
- runFlow:
    when:
      visible: "Photo taken on.*"
    commands:
      - tapOn:
          text: "Photo taken on.*"
          index: 0
      - extendedWaitUntil:
          visible:
            id: "fl_overlay_form_photo"
          timeout: 15000
      - takeScreenshot: F10-drain-form-photo
- runFlow:
    when:
      notVisible: "New overlay"
    commands:
      - pressKey: back
- extendedWaitUntil:
    visible: "New overlay"
    timeout: 10000
- tapOn:
    id: "fl_save"
- extendedWaitUntil:
    visible:
      id: "fl_wall_selection"
    timeout: 10000
- assertVisible: "Sink drain"
- takeScreenshot: F10-drain-picked
- tapOn:
    id: "fl_wall_overlay_done"
- assertVisible: "Range circuit"
- takeScreenshot: F10-wall-overlays
- tapOn:
    id: "fl_back"
- scrollUntilVisible:
    element: "Sink drain"
- assertVisible: "Range circuit"
- tapOn:
    id: "fl_back"
- stopApp
