# Walkthrough F7: Storage on this phone is listed in More with a Free up action (AC-F20).
appId: com.kurtz.homerecord.fieldlog
---
- launchApp:
    clearState: true
- runFlow:
    file: _sign-in.yaml
    env:
      EMAIL: "qa-owner-f07b@example.test"
- extendedWaitUntil:
    visible: "Set up your company"
    timeout: 15000
- tapOn: "Create"
- tapOn:
    id: "fl_welcome_name"
- inputText: "QA Electric"
- hideKeyboard
- tapOn:
    id: "fl_welcome_trade"
- inputText: "Electrical"
- hideKeyboard
- tapOn: "Create company"
- extendedWaitUntil:
    visible: "Today"
# AC-F20 (storage part): More lists storage on this phone with Free up
- tapOn: "More"
- extendedWaitUntil:
    visible:
      id: fl_more_storage
    timeout: 10000
- assertVisible:
    id: fl_more_free_up
