# Walkthrough F6: Owner opens Timesheets from More; an empty week says so and the week picker works (AC-F14).
appId: com.kurtz.homerecord.fieldlog
---
- launchApp:
    clearState: true
- runFlow:
    file: _owner-company.yaml
    env:
      EMAIL: "qa-owner-f06@example.test"
# AC-F14 (week view part): Timesheets opens on a week; an empty week says so and the week picker moves
- tapOn: "More"
- tapOn:
    id: fl_more_timesheets
- extendedWaitUntil:
    visible:
      id: fl_timesheets_empty
    timeout: 10000
- tapOn:
    id: fl_timesheets_prev
- assertVisible:
    id: fl_timesheets_empty
