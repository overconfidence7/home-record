# Walkthrough F1 (first half): fresh install shows sign-in, then the company welcome
# (AC-F1 shell, AC-B1). Sign-in uses the code from the local backend's /dev/last-code; when the
# backend is down there is no code and the flow fails rather than passing unsigned-in.
appId: com.kurtz.homerecord.fieldlog
---
- launchApp:
    clearState: true
- assertVisible: "Sign in"
- assertVisible: "Email"
- assertVisible: "Continue with Google"
- takeScreenshot: F01-sign-in
# Focus guard: Field Log never shows House Manual concepts on its first screen
- assertNotVisible: "Reminders"
- assertNotVisible: "Set up your home"
- tapOn:
    id: "fl_sign_in_email"
- inputText: "qa-owner@example.test"
- hideKeyboard
- tapOn:
    id: "fl_sign_in_send"
# With wrangler dev running, the backend accepts the request and logs the code.
- extendedWaitUntil:
    visible: "Code"
    timeout: 15000
- takeScreenshot: F01-code-entry
# Dev-only: fetch the code from the local backend (PLAN Q005 adds GET /dev/last-code).
- runScript:
    file: ../_scripts/fetch-dev-code.js
    env:
      EMAIL: "qa-owner@example.test"
# No code means the dev backend never answered: that is a failure, not a skip
- assertTrue: ${output.devCode != null && output.devCode != ''}
- tapOn:
    id: "fl_sign_in_code"
- inputText: ${output.devCode}
- hideKeyboard
- tapOn:
    id: "fl_sign_in_verify"
- extendedWaitUntil:
    visible: "Set up your company"
    timeout: 15000
- takeScreenshot: F01-welcome
- tapOn:
    id: "fl_welcome_mode_create"
- tapOn:
    id: "fl_welcome_name"
- inputText: "QA Electric"
- hideKeyboard
- tapOn:
    id: "fl_welcome_trade"
- inputText: "Electrical"
- hideKeyboard
# AC-F1: creating a company lands the Owner on Today, whose empty state says to add a job or invite the crew
- tapOn:
    id: "fl_welcome_submit"
- extendedWaitUntil:
    visible: "Today"
    timeout: 15000
- assertVisible: "Add a job or invite your crew.*"
- assertVisible: "Jobs"
- assertVisible: "Clock"
- assertVisible: "Schedule"
- assertVisible: "More"
- takeScreenshot: F01-today-empty
