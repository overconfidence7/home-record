# Walkthrough F4: clock in on a job, take a break, switch, clock out; the week shows on My timesheet (AC-F8, AC-F10, AC-F11, AC-F18).
appId: com.kurtz.homerecord.fieldlog
---
- launchApp:
    clearState: true
    # The first clock in must find location not yet allowed (AC-F18); say so instead of trusting clearState.
    permissions:
      location: deny
- runFlow:
    file: _sign-in.yaml
    env:
      EMAIL: "qa-owner-f04@example.test"
- extendedWaitUntil:
    visible: "Set up your company"
    timeout: 15000
- tapOn: "Create"
- tapOn:
    id: "fl_welcome_name"
- inputText: "QA Electric"
- hideKeyboard
- tapOn:
    id: "fl_welcome_trade"
- inputText: "Electrical"
- hideKeyboard
- tapOn: "Create company"
- extendedWaitUntil:
    visible: "Today"
    timeout: 15000
- tapOn: "Jobs"
- tapOn:
    id: fl_jobs_new
- tapOn:
    id: fl_jobedit_name
- inputText: "Garage subpanel"
- hideKeyboard
- tapOn:
    id: fl_save
- extendedWaitUntil:
    visible: "Garage subpanel"
    timeout: 10000
- tapOn: "Clock"
- extendedWaitUntil:
    visible: "Not clocked in"
    timeout: 10000
- assertVisible: "My timesheet"
- tapOn:
    id: fl_clock_in
# First clock in explains location before the system prompt (AC-F18); decline to take the no-location path.
- extendedWaitUntil:
    visible: "Use your location to clock in?"
    timeout: 10000
- tapOn:
    id: fl_clock_explain_skip
- extendedWaitUntil:
    visible: "Clocked in"
    timeout: 15000
- assertVisible:
    id: fl_clock_elapsed
- tapOn:
    id: fl_clock_break
- extendedWaitUntil:
    visible: "On break"
    timeout: 10000
- tapOn:
    id: fl_clock_break_end
- extendedWaitUntil:
    visible: "Clocked in"
    timeout: 10000
- tapOn:
    id: fl_clock_out
- extendedWaitUntil:
    visible: "Not clocked in"
    timeout: 10000
# Owner and leads see the crew clock-in card on the Clock tab (AC-F11).
- scrollUntilVisible:
    element:
      id: fl_clock_crew
