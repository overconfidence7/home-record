# Walkthrough F18 (T060a): the screens in More open and return. Clients (AC-F45): a job named with a client,
# phone and email puts that client on More → Clients with Call, Email and the job under them; the job row opens
# the job. Materials (T060b) is below; Settings, About and the signed-in account (T065a, AC-F4, AC-C4) close the flow.
appId: com.kurtz.homerecord.fieldlog
---
- launchApp:
    clearState: true
- runFlow:
    file: _owner-company.yaml
    env:
      EMAIL: "qa-owner-f18@example.test"
- tapOn: "Jobs"
- tapOn:
    id: fl_jobs_new
- tapOn:
    id: fl_jobedit_name
- inputText: "Hale kitchen"
- hideKeyboard
- tapOn:
    id: fl_jobedit_client
- inputText: "Dana Hale"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: fl_jobedit_client_phone
    timeout: 5000
- tapOn:
    id: fl_jobedit_client_phone
- inputText: "5550142290"
- hideKeyboard
- tapOn:
    id: fl_jobedit_client_email
- inputText: "dana@example.test"
- hideKeyboard
- tapOn:
    id: fl_save
- tapOn:
    id: fl_tab_more
# AC-F45: the job's client is on Clients with Call, Email and the job
- tapOn:
    id: fl_more_clients
- extendedWaitUntil:
    visible:
      id: fl_clients_list
    timeout: 10000
- assertVisible: "Dana Hale"
- assertVisible:
    id: "fl_clients_call_.*"
- assertVisible:
    id: "fl_clients_email_.*"
- assertVisible: "Hale kitchen"
- takeScreenshot: F18-clients
# AC-F45: the job row opens the job and Back returns
- tapOn: "Hale kitchen"
- extendedWaitUntil:
    visible:
      id: fl_job_tab_files
    timeout: 10000
- back
- extendedWaitUntil:
    visible:
      id: fl_clients_list
    timeout: 5000
- back
- assertVisible:
    id: fl_more_clients
# AC-F44: Materials and receipts: empty, add a receipt to the job, the job's total and the total for all jobs
- tapOn:
    id: fl_more_materials
- extendedWaitUntil:
    visible:
      id: fl_materials_empty
    timeout: 10000
- tapOn: "Add receipt"
- extendedWaitUntil:
    visible:
      id: fl_material_form_scan
    timeout: 10000
- assertVisible: "Hale kitchen"
- tapOn:
    id: fl_save
- assertVisible: "Enter the amount on the receipt."
- tapOn:
    id: fl_material_form_vendor
- inputText: "City Electric Supply"
- tapOn:
    id: fl_material_form_amount
- inputText: "123.71"
- runFlow: _hide-keyboard.yaml
- scrollUntilVisible:
    element:
      id: fl_material_form_cat_tools
    direction: DOWN
- tapOn:
    id: fl_material_form_cat_tools
- tapOn:
    id: fl_save
- extendedWaitUntil:
    visible:
      id: fl_materials_list
    timeout: 10000
- assertVisible: "City Electric Supply"
- assertVisible: "\\$123\\.71"
- assertVisible:
    id: fl_materials_total
- takeScreenshot: F18-materials
# AC-F44: Export CSV opens the share sheet
- tapOn:
    id: fl_materials_export
- extendedWaitUntil:
    notVisible:
      id: fl_materials_export
    timeout: 10000
- back
- extendedWaitUntil:
    visible:
      id: fl_materials_list
    timeout: 10000
# AC-F44: the receipt opens for editing and deletes with a confirm
- tapOn: "City Electric Supply"
- scrollUntilVisible:
    element:
      id: fl_material_form_delete
    direction: DOWN
    timeout: 10000
- tapOn:
    id: fl_material_form_delete
- tapOn:
    id: fl_material_form_delete_confirm
- extendedWaitUntil:
    visible:
      id: fl_materials_empty
    timeout: 10000
- back
- assertVisible:
    id: fl_more_materials
# T065a (AC-F4): More names the signed-in account
- assertVisible:
    id: fl_more_account
- assertVisible: "Signed in as qa-owner-f18@example.test"
# T065a (AC-C4, AC-F20): Settings picks units, shows notifications and storage, and returns
- scrollUntilVisible:
    element:
      id: fl_more_settings
    direction: DOWN
- assertVisible: "Feet and inches"
- tapOn:
    id: fl_more_settings
- extendedWaitUntil:
    visible:
      id: fl_settings_list
    timeout: 10000
- assertVisible:
    id: fl_settings_notifications
- tapOn:
    id: fl_settings_units_metric
- extendedWaitUntil:
    visible:
      id: fl_more_storage
    timeout: 10000
- takeScreenshot: F18-settings
- back
- scrollUntilVisible:
    element:
      id: fl_more_settings
    direction: DOWN
- assertVisible: "Metric"
# T065a: About shows the version and returns
- scrollUntilVisible:
    element:
      id: fl_more_about
    direction: DOWN
- tapOn:
    id: fl_more_about
- extendedWaitUntil:
    visible:
      id: fl_about_version
    timeout: 10000
- takeScreenshot: F18-about
- back
- assertVisible:
    id: fl_more_about
