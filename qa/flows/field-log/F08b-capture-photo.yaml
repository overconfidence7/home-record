# Walkthrough F8: with the camera allowed, the shutter takes a photo tagged to the job, and the job's Photos tab
# shows it under today's date (AC-F24). The CI emulator has an emulated back camera.
appId: com.kurtz.homerecord.fieldlog
---
- launchApp:
    clearState: true
    permissions:
      camera: allow
      location: deny
- runFlow:
    file: _sign-in.yaml
    env:
      EMAIL: "qa-owner-f08b@example.test"
- extendedWaitUntil:
    visible: "Set up your company"
    timeout: 15000
- tapOn: "Create"
- tapOn:
    id: "fl_welcome_name"
- inputText: "QA Electric"
- hideKeyboard
- tapOn:
    id: "fl_welcome_trade"
- inputText: "Electrical"
- hideKeyboard
- tapOn: "Create company"
- extendedWaitUntil:
    visible: "Today"
    timeout: 15000
- tapOn: "Jobs"
- tapOn:
    id: fl_jobs_new
- tapOn:
    id: fl_jobedit_name
- inputText: "Garage subpanel"
- hideKeyboard
- tapOn:
    id: fl_save
- tapOn: "Garage subpanel"
- tapOn:
    id: fl_job_tab_photos
- extendedWaitUntil:
    visible:
      id: fl_photos_empty
    timeout: 10000
# AC-F24: the shutter takes a photo; the counter shows it was saved
- tapOn:
    id: fl_photos_fab
- extendedWaitUntil:
    visible:
      id: fl_capture_shutter
    timeout: 15000
- assertNotVisible:
    id: fl_capture_denied
# The shutter stays off with a spinner until CameraX has bound; the emulator's camera init retries for ~6 s
- extendedWaitUntil:
    visible:
      id: fl_capture_shutter
      enabled: true
    timeout: 30000
- tapOn:
    id: fl_capture_shutter
- extendedWaitUntil:
    visible:
      id: fl_capture_count
      text: "1"
    timeout: 15000
- takeScreenshot: F08b-capture-one-photo
# AC-F24: back on the job, Photos lists the new photo instead of the empty state
- back
- extendedWaitUntil:
    visible:
      id: "fl_photos_tile_.*"
    timeout: 15000
- assertNotVisible:
    id: fl_photos_empty
- takeScreenshot: F08b-photos-today
