# Walkthrough F8: with the camera allowed, the shutter takes a photo tagged to the job, and the job's Photos tab
# shows it under today's date (AC-F24); Reports then offers the job's photo report for this week (AC-F28 report). The CI emulator has an emulated back camera.
appId: com.kurtz.homerecord.fieldlog
---
- launchApp:
    clearState: true
    permissions:
      camera: allow
      location: deny
- runFlow:
    file: _owner-company.yaml
    env:
      EMAIL: "qa-owner-f08b@example.test"
- tapOn: "Jobs"
- tapOn:
    id: fl_jobs_new
- tapOn:
    id: fl_jobedit_name
- inputText: "Garage subpanel"
- hideKeyboard
- tapOn:
    id: fl_save
- tapOn: "Garage subpanel"
- tapOn:
    id: fl_job_tab_photos
- extendedWaitUntil:
    visible:
      id: fl_photos_empty
    timeout: 10000
# AC-F24: the shutter takes a photo; the counter shows it was saved
- tapOn:
    id: fl_photos_fab
- extendedWaitUntil:
    visible:
      id: fl_capture_shutter
    timeout: 15000
- assertNotVisible:
    id: fl_capture_denied
# rule 30: capture is full screen; no tab bar crowds the shutter
- assertNotVisible:
    id: "fl_tab_today"
# The shutter stays off with a spinner until CameraX has bound; the emulator's camera init retries for ~6 s
- extendedWaitUntil:
    visible:
      id: fl_capture_shutter
      enabled: true
    timeout: 30000
- tapOn:
    id: fl_capture_shutter
- extendedWaitUntil:
    visible:
      id: fl_capture_count
      text: "1"
    timeout: 15000
- takeScreenshot: F08b-capture-one-photo
# AC-F24: back on the job, Photos lists the new photo instead of the empty state
- back
- extendedWaitUntil:
    visible:
      id: "fl_photos_tile_.*"
    timeout: 15000
- assertNotVisible:
    id: fl_photos_empty
- takeScreenshot: F08b-photos-today
# AC-F28 gallery link, AC-B35: the owner shares the job's gallery; the share sheet opens, Back shows "Link is on";
# Turn off link asks first and the line goes
- tapOn:
    id: fl_photos_share_link
- extendedWaitUntil:
    notVisible:
      id: fl_photos_share_link
    timeout: 15000
- takeScreenshot: F08b-gallery-link-sheet
- back
- extendedWaitUntil:
    visible:
      id: fl_photos_link_on
    timeout: 10000
- assertNotVisible:
    id: fl_photos_link_failed
- tapOn:
    id: fl_photos_link_off
- tapOn:
    id: fl_photos_link_off_confirm
- extendedWaitUntil:
    notVisible:
      id: fl_photos_link_on
    timeout: 10000
# SPEC FL-Today, AC-F24: Today shows the new photo under Recent photos; a tap opens it
- back
- tapOn:
    id: fl_tab_today
- scrollUntilVisible:
    element:
      id: "fl_today_photo_.*"
    direction: DOWN
    timeout: 15000
- assertVisible: "Recent photos"
- takeScreenshot: F08b-today-recent-photos
- tapOn:
    id: "fl_today_photo_.*"
- extendedWaitUntil:
    visible:
      id: fl_photo_body
    timeout: 15000
- back
# AC-F24: the company has one job, so Today's camera button opens capture on it without asking
- extendedWaitUntil:
    visible:
      id: fl_today_capture
    timeout: 10000
- tapOn:
    id: fl_today_capture
- extendedWaitUntil:
    visible:
      id: fl_capture_shutter
    timeout: 15000
- assertVisible: "Garage subpanel"
- takeScreenshot: F08b-today-capture
# AC-F28 (report part): this week's photo report lists the job with its photo; tapping it makes the PDF and opens the share sheet
- back
- extendedWaitUntil:
    visible:
      id: fl_today_capture
    timeout: 10000
- tapOn: "More"
- tapOn:
    id: fl_more_reports
- extendedWaitUntil:
    visible:
      id: fl_reports_list
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "fl_reports_photos_[0-9a-f-]{36}"
    timeout: 15000
- assertVisible: "Photo reports"
- assertVisible: "1 photo"
- takeScreenshot: F08b-photo-report
- tapOn:
    id: "fl_reports_photos_[0-9a-f-]{36}"
# the system share sheet is on top; leave it like a person who picked nothing
- back
- extendedWaitUntil:
    visible: "Photo reports"
    timeout: 10000
- assertNotVisible:
    id: fl_reports_photos_failed
