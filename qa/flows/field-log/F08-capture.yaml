# Walkthrough F8: open Capture from a job, shutter and gallery are present, camera denied state offers Settings and gallery and a typed note saves to today (AC-F27, AC-F29). F08b takes a photo.
appId: com.kurtz.homerecord.fieldlog
---
- launchApp:
    clearState: true
    # AC-F29 needs the camera not yet allowed; the suite grants CAMERA after install and Maestro's launchApp
    # grants by default, so say so instead of trusting clearState (as F04 does for location).
    permissions:
      camera: deny
- runFlow:
    file: _sign-in.yaml
    env:
      EMAIL: "qa-owner-f08@example.test"
- extendedWaitUntil:
    visible: "Set up your company"
    timeout: 15000
- tapOn: "Create"
- tapOn:
    id: "fl_welcome_name"
- inputText: "QA Electric"
- hideKeyboard
- tapOn:
    id: "fl_welcome_trade"
- inputText: "Electrical"
- hideKeyboard
- tapOn: "Create company"
- extendedWaitUntil:
    visible: "Today"
    timeout: 15000
- tapOn: "Jobs"
- tapOn:
    id: fl_jobs_new
- tapOn:
    id: fl_jobedit_name
- inputText: "Garage subpanel"
- hideKeyboard
- tapOn:
    id: fl_save
- tapOn: "Garage subpanel"
# Capture is the Photos tab's FAB (SPEC FL-Job).
- tapOn:
    id: fl_job_tab_photos
- extendedWaitUntil:
    visible:
      id: fl_photos_empty
    timeout: 10000
# AC-F29: with the camera refused, Capture explains, links to Settings and still offers the gallery
- tapOn:
    id: fl_photos_fab
- tapOn:
    text: "Don.t allow"
    optional: true
- extendedWaitUntil:
    visible:
      id: fl_capture_gallery
    timeout: 15000
- assertVisible:
    id: fl_capture_denied
- assertVisible:
    id: fl_capture_settings
# AC-F27: a typed note saves to the job and today; voice memo is offered
- tapOn:
    id: fl_capture_note
- tapOn:
    id: fl_capture_note_text
- inputText: "Homeowner wants the island moved"
- hideKeyboard
- tapOn:
    id: fl_capture_note_save
- extendedWaitUntil:
    visible:
      id: fl_capture_message
    timeout: 10000
- assertVisible: "Note saved to today."
- assertVisible:
    id: fl_capture_voice
