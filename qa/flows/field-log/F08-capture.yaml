# Walkthrough F8: open Capture from a job, shutter and gallery are present, camera denied state offers Settings and gallery and a typed note saves to today (AC-F24, AC-F27, AC-F29, AC-F54).
appId: com.kurtz.homerecord.fieldlog
---
- launchApp:
    clearState: true
- runFlow:
    file: _sign-in.yaml
    env:
      EMAIL: "qa-owner-f08@example.test"
- extendedWaitUntil:
    visible: "Set up your company"
    timeout: 15000
- tapOn: "Create"
- tapOn:
    id: "fl_welcome_name"
- inputText: "QA Electric"
- hideKeyboard
- tapOn:
    id: "fl_welcome_trade"
- inputText: "Electrical"
- hideKeyboard
- tapOn: "Create company"
- extendedWaitUntil:
    visible: "Today"
    timeout: 15000
- tapOn: "Jobs"
- tapOn:
    id: fl_jobs_new
- tapOn:
    id: fl_jobedit_name
- inputText: "Garage subpanel"
- hideKeyboard
- tapOn:
    id: fl_save
- tapOn: "Garage subpanel"
- tapOn:
    id: fl_job_capture
- tapOn:
    text: "Don't allow"
    optional: true
- extendedWaitUntil:
    visible:
      id: fl_capture_gallery
    timeout: 15000
- assertVisible:
    id: fl_capture_gallery
- tapOn:
    id: fl_capture_note
- tapOn:
    id: fl_capture_note_text
- inputText: "Homeowner wants the island moved"
- hideKeyboard
- tapOn:
    id: fl_capture_note_save
- extendedWaitUntil:
    visible:
      id: fl_capture_message
    timeout: 10000
- assertVisible: "Note saved to today."
- assertVisible:
    id: fl_capture_voice
