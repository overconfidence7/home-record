# Subflow: put the keyboard away inside a form. With no keyboard up, Maestro's hideKeyboard is a Back, and a dirty form
# rightly asks "Discard changes?" ([judge: flow error] F18 on 323d8128); keep editing when it does.
appId: com.kurtz.homerecord.fieldlog
---
- hideKeyboard
- runFlow:
    when:
      visible:
        id: fl_keep_editing
    commands:
      - tapOn:
          id: fl_keep_editing
