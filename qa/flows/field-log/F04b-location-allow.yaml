# Walkthrough F4: the first clock in explains location, then the system asks for it; allowing it still clocks in (AC-F8, AC-F18).
# The app asks for precise and approximate together: on Android 12+ a request for precise alone is dropped with no dialog.
appId: com.kurtz.homerecord.fieldlog
---
- launchApp:
    clearState: true
    # The first clock in must find location not yet allowed (AC-F18); say so instead of trusting clearState.
    permissions:
      location: deny
- runFlow:
    file: _sign-in.yaml
    env:
      EMAIL: "qa-owner-f04b@example.test"
- extendedWaitUntil:
    visible: "Set up your company"
    timeout: 15000
- tapOn: "Create"
- tapOn:
    id: "fl_welcome_name"
- inputText: "QA Electric"
- hideKeyboard
- tapOn:
    id: "fl_welcome_trade"
- inputText: "Electrical"
- hideKeyboard
- tapOn: "Create company"
- extendedWaitUntil:
    visible: "Today"
    timeout: 15000
- tapOn: "Jobs"
- tapOn:
    id: fl_jobs_new
- tapOn:
    id: fl_jobedit_name
- inputText: "Garage subpanel"
- hideKeyboard
- tapOn:
    id: fl_save
- extendedWaitUntil:
    visible: "Garage subpanel"
    timeout: 10000
- tapOn: "Clock"
- extendedWaitUntil:
    visible: "Not clocked in"
    timeout: 10000
- tapOn:
    id: fl_clock_in
- extendedWaitUntil:
    visible: "Use your location to clock in?"
    timeout: 10000
- tapOn:
    id: fl_clock_explain_ok
# The system location dialog must appear (it did not when only precise was requested).
- extendedWaitUntil:
    visible: "While using the app"
    timeout: 10000
- tapOn: "While using the app"
- extendedWaitUntil:
    visible: "Clocked in"
    timeout: 20000
- tapOn:
    id: fl_clock_out
- extendedWaitUntil:
    visible: "Not clocked in"
    timeout: 10000
