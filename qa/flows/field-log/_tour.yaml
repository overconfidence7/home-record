# Helper, not a walkthrough step: visit every root tab and screenshot it under the variant the
# device suite sets (light, dark, font200, landscape). Field Log needs a signed-in company for
# its tabs; when the app is still on the sign-in screen the tour screenshots that and stops.
appId: com.kurtz.homerecord.fieldlog
---
# No `env:` default here: a flow's own env overrides `maestro test -e`, which named every
# variant's shots tour-light-*. The variant comes from -e QA_VARIANT, light when unset.
- evalScript: ${output.variant = (typeof QA_VARIANT !== 'undefined' && QA_VARIANT) || 'light'}
- launchApp
# The first frame takes 4-5 s on a cold emulator; a shot right after launchApp was blank and the
# tour "passed" having seen nothing ([judge:qa-fl-tour-blank]). Wait for whichever root shows.
- extendedWaitUntil:
    visible: "Sign in|Set up your company|Today"
    timeout: 20000
# Rotate once the app is on top ([auto:variant:field-log:landscape]): launchApp stops the app and shows
# the launcher, which holds the display portrait (lastOrientation=5, NOSENSOR), and a setOrientation
# that writes the user_rotation the suite already set changes no setting, so nothing rotated back.
# Going through PORTRAIT first makes LANDSCAPE_LEFT a real change.
- runFlow:
    when:
      true: ${output.variant == 'landscape'}
    commands:
      - setOrientation: PORTRAIT
      - setOrientation: LANDSCAPE_LEFT
      - extendedWaitUntil:
          visible: "Sign in|Set up your company|Today"
          timeout: 20000
- takeScreenshot: tour-${output.variant}-launch
- runFlow:
    when:
      visible: "Today"
    commands:
      - tapOn:
          id: "fl_tab_today"
      - takeScreenshot: tour-${output.variant}-today
      - tapOn:
          id: "fl_tab_jobs"
      - takeScreenshot: tour-${output.variant}-jobs
      - tapOn:
          id: "fl_tab_clock"
      - takeScreenshot: tour-${output.variant}-clock
      - tapOn:
          id: "fl_tab_schedule"
      - extendedWaitUntil:
          visible:
            id: "fl_schedule_week"
          timeout: 10000
      - takeScreenshot: tour-${output.variant}-schedule
      - tapOn:
          id: "fl_tab_more"
      - takeScreenshot: tour-${output.variant}-more
      - tapOn: "Team"
      - takeScreenshot: tour-${output.variant}-team
      - tapOn:
          id: "fl_back"
      # Materials and receipts pushed Company below the fold in landscape
      - scrollUntilVisible:
          element: "Company"
          direction: DOWN
          timeout: 10000
      - tapOn: "Company"
      - takeScreenshot: tour-${output.variant}-company
      - tapOn:
          id: "fl_close"
      - tapOn:
          id: "fl_tab_today"
- runFlow:
    when:
      true: ${output.variant == 'landscape'}
    commands:
      - setOrientation: PORTRAIT
